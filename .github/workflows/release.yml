name: ci-release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Unit and forwarding tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Release build
        run: |
          set -euo pipefail
          cargo build --release --locked
          strip target/release/relaydeck-lite
          file target/release/relaydeck-lite
          test "$(stat -c '%s' target/release/relaydeck-lite)" -lt 12000000
          ./target/release/relaydeck-lite --help

      - name: Package glibc binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -C target/release -czf \
            "dist/relaydeck-lite_${version}_linux_amd64_gnu.tar.gz" \
            relaydeck-lite

      - name: Alpine musl build and smoke test
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/relaydeck-lite
          file target/x86_64-unknown-linux-musl/release/relaydeck-lite
          test "$(stat -c '%s' target/x86_64-unknown-linux-musl/release/relaydeck-lite)" -lt 12000000
          docker run --rm \
            -v "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/release/relaydeck-lite:/relaydeck-lite:ro" \
            alpine:3.23 /relaydeck-lite --help

      - name: Package musl binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-musl/release -czf \
            "dist/relaydeck-lite_${version}_linux_amd64_musl.tar.gz" \
            relaydeck-lite

      - name: Upload release archives
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: relaydeck-lite-linux-amd64
          path: dist/relaydeck-lite_*_linux_amd64_*.tar.gz
          if-no-files-found: error
          retention-days: 2

      - name: Check service files
        run: |
          bash -n scripts/install.sh
          shellcheck scripts/install.sh
          bash -n deploy/relaydeck-lite.openrc
          grep -Fq 'ExecStart=/usr/local/bin/relaydeck-lite run' deploy/relaydeck-lite.service

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: relaydeck-lite-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f -name 'relaydeck-lite_*_linux_*.tar.gz' | wc -l)"
          test "${count}" -eq 2
          sha256sum relaydeck-lite_*_linux_*.tar.gz > checksums.txt
          sha256sum -c checksums.txt
          cat checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              relaydeck-lite_*_linux_*.tar.gz checksums.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              relaydeck-lite_*_linux_*.tar.gz checksums.txt \
              --verify-tag \
              --generate-notes
          fi
